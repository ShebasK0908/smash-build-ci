name: Build Smash (nxnative)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout (repo de build, sin archivos del juego)
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 27.2 y liberar disco
        run: |
          for d in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -d "$d" ]; then sudo xcode-select -s "$d"; echo "Seleccionado $d"; fi
          done
          xcodebuild -version
          xcrun -sdk macosx metal --version
          for d in /Applications/Xcode*.app; do
            case "$(basename "$d")" in
              *27.2*) echo "mantengo $d" ;;
              *) echo "borro $d"; sudo rm -rf "$d" ;;
            esac
          done
          rm -rf ~/Library/Android 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator 2>/dev/null || true
          sudo rm -rf /Applications/GarageBand.app /Applications/iMovie.app /Applications/Keynote.app /Applications/Numbers.app /Applications/Pages.app 2>/dev/null || true
          for d in /opt/hostedtoolcache/*; do
            case "$d" in
              *Python*|*python*|*dotnet*|*DotNet*|*gh*|*GitHub*) echo "mantengo $d" ;;
              *) echo "borro $d"; sudo rm -rf "$d" ;;
            esac
          done
          for x in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -d "$x" ]; then sudo rm -rf "$x/Contents/Developer/Platforms/WatchOS.platform" "$x/Contents/Developer/Platforms/AppleTVOS.platform" "$x/Contents/Developer/Platforms/XROS.platform" 2>/dev/null || true; fi
          done
          rm -rf ~/Library/Caches/* /Library/Caches/* 2>/dev/null || true
          df -h /

      - name: Herramientas y nxnative (upstream, al día)
        run: |
          xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk || true
          python3 -m pip install --user --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic
          python3 -m pip install --user --break-system-packages "backports.zstd; python_version < '3.14'" || true
          cd ~ && git clone --depth 1 https://github.com/seedds/nxnative.git

      - name: Parche - lanzador en español y controles rediseñados
        run: |
          python3 "$GITHUB_WORKSPACE/tools/parche_smash.py" ~/nxnative

      - name: Descargar el juego desde la release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p ~/Games/Smash ~/keys
          cd ~/Games/Smash
          gh release download smash-game --repo ShebasK0908/smash-build --dir dl
          ls -la dl | head -5
          cp dl/prod.keys ~/keys/prod.keys
          test -s ~/keys/prod.keys
          cat dl/game-part-* > "[01006A800016E000].nsp"
          test $(stat -f%z "[01006A800016E000].nsp") -eq 14638743603
          cat dl/upd-part-* > "[01006A800016E800].nsp"
          test $(stat -f%z "[01006A800016E800].nsp") -eq 3931902540
          head -c 4 "[01006A800016E000].nsp" | grep -q PFS0
          head -c 4 "[01006A800016E800].nsp" | grep -q PFS0
          rm -rf dl
          ls -la

      - name: Build del IPA (se instala SOBRE el Smash ya instalado - misma app, conserva la partida; idioma del juego - español)
        run: |
          df -h /
          touch /tmp/build_ipa.log
          tail -f /tmp/build_ipa.log &
          TAILPID=$!
          python3 ~/nxnative/scripts/build_ipa_from_nsp.py ~/Games/Smash -k ~/keys/prod.keys -l es --no-keep-extracted --bundle-id org.nxnative.01006a800016e000 > /tmp/build_ipa.log 2>&1 &
          BGPID=$!
          while kill -0 $BGPID 2>/dev/null; do
            if grep -q "\[3/7\] rewrite" /tmp/build_ipa.log 2>/dev/null; then
              rm -f ~/Games/Smash/"[01006A800016E000].nsp" ~/Games/Smash/"[01006A800016E800].nsp"
              echo "NSP liberados tras la extraccion (18.5 GB)"
              break
            fi
            sleep 10
          done
          wait $BGPID
          RC=$?
          kill $TAILPID 2>/dev/null || true
          ls -la ~/Games/Smash
          df -h /
          exit $RC

      - name: Subir el resultado a la release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          cd ~/Games/Smash
          df -h /
          IPA=$(find . -maxdepth 2 -name '*.ipa' | head -1)
          test -n "$IPA"
          ls -la "$IPA"
          rm -rf 01006A800016E000_build
          df -h /
          gh release create smash-ipa-v3 --repo ShebasK0908/smash-build --title "Smash controles fabrica transparentes (privado)" --notes "Build propia del usuario desde su copia, con sus controles en el layout 3D con el color y la transparencia de los controles de fabrica de DmIOS (vista previa v12 aprobada); el layout 2D queda con los controles normales de fabrica. Mismo bundle id que su Smash instalado: se instala encima y conserva la partida. Respaldos: build original en smash-ipa y controles bronce en smash-ipa-v2. No compartir." || true
          SIZE=$(stat -f%z "$IPA")
          N=$(( (SIZE + 1992294400 - 1) / 1992294400 ))
          i=0
          while [ $i -lt $N ]; do
            PART=$(printf 'ipa-part-%02d' $i)
            dd if="$IPA" of="$PART" bs=1900m skip=$i count=1 2>/dev/null
            gh release upload smash-ipa-v3 "$PART" --clobber --repo ShebasK0908/smash-build
            rm -f "$PART"
            i=$((i + 1))
          done
